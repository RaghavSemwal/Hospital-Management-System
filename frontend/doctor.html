<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Portal · Central HMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">🏥 Central HMS</a>
    <span class="topbar-tag doctor-tag">Doctor Portal</span>
  </header>

  <h2>🩺 Doctor Login</h2>
  <form id="doctorLoginForm">
    <fieldset>
      <legend>Sign in</legend>
      <input type="text" name="doctorId" placeholder="Doctor ID (101-105)" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </fieldset>
  </form>

  <div id="doctorDashboard" style="display:none;">
    <h3>Doctor Dashboard</h3>
    <div class="action-bar">
      <button onclick="viewDoctorAppointments()">📅 My Appointments</button>
      <button onclick="viewDoctorQueue()">⭐ My Queue (Senior Priority)</button>
      <button onclick="viewDoctorPrescriptions()">💊 My Prescriptions</button>
      <button onclick="viewDoctorAnalytics()">📊 Analytics &amp; Revenue</button>
      <button onclick="viewAllPatients('doctorContent')">🗂️ All Patient Records</button>
    </div>

    <h3>Write Prescription</h3>
    <form id="prescriptionForm">
      <fieldset>
        <legend>New prescription</legend>
        <input type="text" name="patientId" placeholder="Patient ID" required>
        <input type="text" name="doctorId" placeholder="Doctor ID" required>
        <input type="text" name="medication" placeholder="Medication" required>
        <input type="text" name="labTestOrder" placeholder="Lab Test (or None)" required>
        <input type="text" name="followUpDate" placeholder="Follow-up Date (DD-MM-YYYY)" required>
        <button type="submit">Submit Prescription</button>
      </fieldset>
    </form>

    <div id="doctorContent"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
