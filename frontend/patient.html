<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patient Portal · Central HMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">🏥 Central HMS</a>
    <span class="topbar-tag patient-tag">Patient Portal</span>
  </header>

  <h2>📅 Book an Appointment</h2>

  <form id="bookingForm">
    <fieldset>
      <legend>1. Your Details</legend>
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="number" name="age" placeholder="Age" min="1" max="120" required>
      <input type="text" name="ailment" placeholder="Ailment" required>
      <input type="text" name="phone" placeholder="Phone" required>
    </fieldset>

    <fieldset>
      <legend>2. Choose a Specialist</legend>
      <select id="doctorSelect" name="doctorId" required>
        <option value="">-- Select a doctor --</option>
      </select>
      <button type="button" id="checkSlotsBtn">Check Available Slots</button>
    </fieldset>

    <fieldset id="slotFieldset" style="display:none;">
      <legend>3. Choose a Time Slot</legend>
      <div id="slotOptions"></div>
    </fieldset>

    <fieldset>
      <legend>4. Payment</legend>
      <label><input type="radio" name="payNow" value="yes" checked> Simulate Payment Now (Pay ₹500)</label>
      <label><input type="radio" name="payNow" value="no"> Pay Later at Hospital</label>
    </fieldset>

    <button type="submit" id="confirmBookingBtn" disabled>Confirm Booking</button>
  </form>

  <div id="receipt" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>
